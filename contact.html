<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto – Cesar De la Rosa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">Cesar De la Rosa</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="menu">Menú</button>
      <nav id="menu" class="menu" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="about.html">Sobre mí</a>
        <a href="proyectos.html">Proyectos</a>
        <a href="contact.html" aria-current="page">Contacto</a>
        <button id="themeToggle" class="icon-btn" aria-label="Cambiar a modo oscuro">🌙</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap page-head"><h1>Contacto</h1></div>
    <section style="padding-top:1.5rem">
      <div class="wrap two-col">
        <div>
          <form id="contactForm">
            <div><label for="nombre">Nombre</label><input type="text" id="nombre" autocomplete="name" required></div>
            <div><label for="email">Correo electrónico</label><input type="email" id="email" autocomplete="email" required></div>
            <div><label for="mensaje">Mensaje</label><textarea id="mensaje" rows="6" required></textarea></div>
            <div><button type="submit" class="btn">Abrir en mi correo</button></div>
            <p class="note" id="formResponse" role="status"></p>
          </form>
        </div>
        <div>
          <h2 style="font-size:1.4rem">Otras vías</h2>
          <ul class="contact-list">
            <li><strong>Email:</strong> <a href="mailto:cdelarosamota1@gmail.com">cdelarosamota1@gmail.com</a></li>
            <li><strong>Teléfono:</strong> +1 (829) 250-0061</li>
            <li><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/cesardelarosa023/" target="_blank" rel="noopener">linkedin.com/in/cesardelarosa023</a></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>&copy; 2026 Cesar De la Rosa. Todos los derechos reservados.</p></div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Un sitio estático no puede enviar correos por sí solo: este formulario prepara
    // el mensaje y lo abre en el programa de correo de la persona.
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var nombre = document.getElementById('nombre').value.trim();
      var email = document.getElementById('email').value.trim();
      var mensaje = document.getElementById('mensaje').value.trim();
      var asunto = 'Contacto desde tu portafolio – ' + nombre;
      var cuerpo = mensaje + '\n\n' + nombre + '\n' + email;
      window.location.href = 'mailto:cdelarosamota1@gmail.com?subject=' +
        encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
      document.getElementById('formResponse').textContent =
        'Se abrió tu programa de correo con el mensaje listo. Pulsa enviar allí para completarlo.';
    });
  </script>
</body>
</html>
