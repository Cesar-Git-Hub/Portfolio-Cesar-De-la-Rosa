<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Cesar De la Rosa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Mi Portafolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contacto</a></li>
          <li class="nav-item">
            <button id="darkModeToggle" class="btn btn-outline-secondary ms-3">🌙</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTACTO -->
  <main class="container mt-5">
    <h2 class="mb-4">Contáctame</h2>
    <div class="row">
      <!-- Formulario -->
      <div class="col-md-6">
        <form id="contactForm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <div id="formResponse" class="mt-3"></div>
      </div>

      <!-- Datos de contacto -->
      <div class="col-md-6">
        <h4>Mis datos</h4>
        <p><strong>Email:</strong> <a href="mailto:cdelarosamota1@gmail.com">cdelarosamota1@gmail.com</a></p>
        <p><strong>Teléfono:</strong> +1 (829) 250-0061</p>
        <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/cesardelarosa023/" target="_blank">https://www.linkedin.com/in/cesardelarosa023/</a></p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-light text-center py-3 mt-5">
    <p>&copy; 2026 Cesar De la Rosa. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dark Mode Toggle
    const toggleBtn = document.getElementById('darkModeToggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    // Formulario dinámico
    const form = document.getElementById('contactForm');
    const responseDiv = document.getElementById('formResponse');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const mensaje = document.getElementById('mensaje').value;

      responseDiv.innerHTML = `
        <div class="alert alert-success">
          ¡Gracias ${nombre}! Tu mensaje ha sido enviado correctamente.<br>
          <strong>Email:</strong> ${email}<br>
          <strong>Mensaje:</strong> ${mensaje}
        </div>
      `;

      form.reset();
    });
  </script>
</body>
</html>
